<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一起看 · 两个人的小影院</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="lobby" class="screen">
  <h1>一起看<span>两个人的小影院</span></h1>
  <p class="sub">同一个片源，同步播放，随时戳一戳</p>
  <input id="name" placeholder="你的昵称" maxlength="12">
  <button id="createBtn" class="primary">创建房间</button>
  <div class="divider">或者</div>
  <div class="row">
    <input id="roomInput" placeholder="房间码" maxlength="4">
    <button id="joinBtn" class="primary">加入</button>
  </div>
  <p id="lobbyErr" class="err"></p>
</div>

<div id="roomView" class="screen hidden">
  <header>
    <div class="roominfo">房间 <b id="roomCode"></b>
      <button id="copyBtn" class="mini">邀请</button>
    </div>
    <div id="members" class="members"></div>
  </header>

  <div id="stage">
    <video id="video" playsinline></video>
    <div id="noSource" class="placeholder">屋主还没选片<br><span>支持视频直链，或两边放同一个本地文件</span></div>
    <div id="localPrompt" class="placeholder hidden">
      屋主选择了本地文件：<b id="localTitle"></b><br>
      <label class="primary filebtn">选择我这边的文件<input id="localFile" type="file" accept="video/*" hidden></label>
    </div>
    <div id="unlock" class="placeholder hidden"><button id="unlockBtn" class="primary">点一下开始接收</button></div>
  </div>

  <div id="controls">
    <div id="progressRow">
      <span id="curTime">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" disabled>
      <span id="durTime">--:--</span>
    </div>
    <div id="btnRow">
      <button id="playBtn" class="primary" disabled>▶ 播放</button>
      <button id="fsBtn" title="全屏">⛶</button>
      <button id="srcBtn" disabled>选片</button>
      <button id="pokeBtn">戳一下</button>
      <button id="chatBtn">聊天</button>
    </div>
    <div id="srcBar" class="hidden">
      <input id="urlInput" placeholder="粘贴视频直链（mp4/webm）">
      <button id="urlBtn">用链接</button>
      <label class="filebtn">本地文件<input id="hostFile" type="file" accept="video/*" hidden></label>
    </div>
    <p id="roleHint" class="hint"></p>
  </div>

  <div id="chatDrawer" class="hidden">
    <div id="chatLog"></div>
    <form id="chatForm">
      <input id="chatInput" placeholder="说点什么…" maxlength="300" autocomplete="off">
      <button>发送</button>
    </form>
  </div>

  <div id="toast"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
